<section class="register">
  <h1>Create account</h1>
  <p class="note">Register as a normal user.</p>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      required
      minlength="3"
      [(ngModel)]="username">

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      required
      [(ngModel)]="email">

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      minlength="6"
      [(ngModel)]="password">

    <button type="submit" [disabled]="!registerForm.form.valid">Create account</button>
  </form>

  <p class="status" *ngIf="status">{{ status }}</p>
  <p class="note">Already have an account? <a routerLink="/login">Login</a></p>
</section>
